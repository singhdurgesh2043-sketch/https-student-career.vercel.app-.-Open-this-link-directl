name: Build & Verify Android Release APK & AAB

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, Sign & Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 5. Install Node Dependencies
        run: npm ci

      - name: 6. Build Web Production Bundle
        run: npm run build

      - name: 7. Sync Capacitor Android
        run: npx cap sync android

      - name: 8. Grant Execution Permission
        run: |
          chmod +x android/gradlew
          chmod +x scripts/sign-and-verify.sh

      - name: 9. Compile Release Binaries (Gradle)
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: 10. Execute Release Signing & Strict Verification
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/sign-and-verify.sh

      - name: 11. Upload Verified Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentCareerApp-Verified-Signed-APK
          path: dist-android/StudentCareerApp-release-signed.apk
          if-no-files-found: error
          retention-days: 60

      - name: 12. Upload Verified Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: StudentCareerApp-Verified-Signed-AAB
          path: dist-android/StudentCareerApp-release-signed.aab
          if-no-files-found: error
          retention-days: 60

      - name: 13. Upload Permanent Release Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: StudentCareerApp-Permanent-Keystore
          path: dist-android/StudentCareerApp-Permanent-Keystore.zip
          if-no-files-found: error
          retention-days: 60
