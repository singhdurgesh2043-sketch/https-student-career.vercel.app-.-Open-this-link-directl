name: Build Android Release APK & AAB

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 5. Install Node Dependencies
        run: npm ci

      - name: 6. Build Web Production Bundle
        run: npm run build

      - name: 7. Sync Capacitor Android
        run: npx cap sync android

      - name: 8. Grant Execution Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 9. Configure Signing Credentials (if present in Secrets)
        id: signing_check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret detected. Decoding release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "is_signed=true" >> $GITHUB_OUTPUT
            echo "Status: Keystore successfully configured for signing."
          else
            echo "No keystore secret provided. Building unsigned release binaries."
            echo "is_signed=false" >> $GITHUB_OUTPUT
          fi

      - name: 10. Compile Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: 11. Compile Release AAB (App Bundle for Play Store)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: 12. Verify Generated Android Binaries
        id: verify_outputs
        run: |
          echo "=== VERIFYING GENERATED ARTIFACTS ==="
          mkdir -p dist-android
          
          APK_FILE=$(find android/app/build/outputs/apk/release -type f \( -name "*.apk" \) | head -n 1)
          AAB_FILE=$(find android/app/build/outputs/bundle/release -type f \( -name "*.aab" \) | head -n 1)
          
          if [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" dist-android/StudentCareerApp-release.apk
            ls -lh dist-android/StudentCareerApp-release.apk
            sha256sum dist-android/StudentCareerApp-release.apk
          else
            echo "::error::Release APK was not generated!"
            exit 1
          fi

          if [ -f "$AAB_FILE" ]; then
            echo "Found AAB: $AAB_FILE"
            cp "$AAB_FILE" dist-android/StudentCareerApp-release.aab
            ls -lh dist-android/StudentCareerApp-release.aab
            sha256sum dist-android/StudentCareerApp-release.aab
          else
            echo "::error::Release AAB was not generated!"
            exit 1
          fi

      - name: 13. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentCareerApp-Release-APK
          path: dist-android/StudentCareerApp-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 14. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentCareerApp-Release-AAB
          path: dist-android/StudentCareerApp-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: 15. Generate Build Summary
        run: |
          echo "## 🚀 Student Career App – Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** \`com.studentcareer.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Student Career App" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK:** \`StudentCareerApp-release.apk\` (Ready for sideload / direct install)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release AAB:** \`StudentCareerApp-release.aab\` (Ready for Google Play Store upload)" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Status:** ${{ steps.signing_check.outputs.is_signed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both binaries are available under the **Artifacts** tab on this workflow run." >> $GITHUB_STEP_SUMMARY
